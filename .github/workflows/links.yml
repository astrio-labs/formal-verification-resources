name: External links

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --scheme http
            --scheme https
            --timeout 30
            --max-retries 2
            --retry-wait-time 5
            --max-concurrency 4
            --host-concurrency 2
            README.md CONTRIBUTING.md
          fail: true
          failIfEmpty: true
          jobSummary: true
